<main id="main" class="game-shell binary-shell container"><p class="eyebrow">A LITTLE MAGIC</p><h1>六张卡片<span>猜数字</span></h1><p class="game-intro">在心里选一个 <strong>1～63</strong> 的整数。勾选所有出现这个数字的卡片，再让它猜猜你想的是几。</p><form id="guess-form"><div id="cards" class="number-cards" aria-label="六张数字卡片"></div><div class="guess-actions"><button class="primary-link guess-button" type="submit">揭晓答案 ✨</button><button class="restart" type="reset">再玩一次</button></div></form><p id="answer" class="guess-answer" role="status" aria-live="polite"></p><details class="game-panel explanation"><summary>为什么六张卡片能猜到 63？</summary><p>每张卡片代表一个二进制位，分别是 1、2、4、8、16、32。将勾选卡片对应的数相加，就能还原你选的数字。</p><p>六位二进制共有 64 种组合，包括 0；因此这个游戏能猜 1～63，最大值是 2⁶ − 1 = 63。</p></details><p class="game-note">无广告 · 无需登录 · 支持触屏和键盘</p><noscript><p>请启用 JavaScript 来玩这个小游戏。</p></noscript></main><script src="binary.js" defer></script></body></html>
